<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reality Is But An Illusion.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&display=swap"
    rel="stylesheet"
  >
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #000;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: #000;
      color: #fff;
    }

    main {
      width: min(92vw, 1200px);
      padding: clamp(1.5rem, 4vw, 3rem);
      container-type: inline-size;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-family: "Cormorant Garamond", "Times New Roman", serif;
      /* "Reality Is But" is ~5.81em; 17cqi keeps that line inside the column. */
      font-size: min(clamp(3.6rem, 9.6vw, 8rem), 17cqi);
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Reality Is But<br>An Illusion.</h1>
  </main>
</body>
</html>
